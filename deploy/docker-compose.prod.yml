# Production-style stack: the API behind Caddy, which obtains and renews a real
# TLS certificate automatically. HTTPS is what lets phones install the PWA and
# use the live camera from anywhere.
#
#   DOMAIN=parts.example.com docker compose -f deploy/docker-compose.prod.yml up -d
#
# Point the domain's A/AAAA record at this host and open ports 80/443 first.
services:
  api:
    build:
      context: ..
      args:
        EXTRAS: faiss,llm,heic
    env_file: ../.env
    environment:
      MCV_DATA_DIR: /data
      MCV_CATALOG_DB: /data/catalog/catalog.sqlite
      MCV_INDEX_DIR: /data/index
      MCV_MODEL_DIR: /data/models
      MCV_QUERIES_DIR: /data/queries
      MCV_FORWARDED_ALLOW_IPS: "*"  # Caddy sets X-Forwarded-For; rate limits are per phone
      MCV_RATE_LIMIT_PER_MINUTE: "120"
    volumes:
      - ../data:/data
    expose: ["8000"]
    restart: unless-stopped
    healthcheck:  # /health is cheap and reports ready: true once the index is loaded
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Closes the loop on a schedule: confirmed and bought photos into the index every hour,
  # a purchase-weighted retrain once MCV_LEARN_RETRAIN_AFTER new ones arrived. The API
  # picks a rebuilt index up by itself; a retrain that switches model version goes to
  # sibling directories and is switched on by an explicit env change (see RUNBOOK 3).
  learner:
    build:
      context: ..
      args:
        EXTRAS: ml,faiss
    env_file: ../.env
    environment:
      MCV_DATA_DIR: /data
      MCV_CATALOG_DB: /data/catalog/catalog.sqlite
      MCV_INDEX_DIR: /data/index
      MCV_MODEL_DIR: /data/models
      MCV_QUERIES_DIR: /data/queries
      MCV_LEARN_EVERY_S: "3600"
    volumes:
      - ../data:/data
    restart: unless-stopped
    command: ["sh", "-c", "while true; do mcv learn >> /data/logs/learn.log 2>&1; sleep ${MCV_LEARN_EVERY_S:-3600}; done"]

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN=your.host.name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
