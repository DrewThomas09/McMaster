# Fine-tuning recipe for a CLIP ViT-B/16 backbone with a supervised-contrastive
# objective. Run with: mcv train --config configs/train_openclip.yaml
backbone: openclip
backbone_model: ViT-B-16
backbone_pretrained: laion2b_s34b_b88k
image_size: 224
embedding_dim: 512

loss: supcon             # supcon | arcface | triplet
arcface_margin: 0.3
arcface_scale: 30.0
temperature: 0.07

epochs: 10
batch_size: 128
lr: 1.0e-5
head_lr: 1.0e-3
weight_decay: 0.05
warmup_steps: 500
freeze_backbone_epochs: 1
hard_negative_mining: true
mining_refresh_every: 1
num_workers: 8
amp: true
seed: 42
output_dir: ./data/models/openclip-vitb16-supcon
