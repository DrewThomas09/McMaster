<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5fff">
<title>McMaster-Vision</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1c1e21; --muted:#6b7280; --accent:#0b5fff; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111317; --card:#1b1e24; --ink:#e7e9ee; --muted:#9aa3b2; --line:#2a2f38; } }
  * { box-sizing:border-box; }
  html, body { max-width:100%; overflow-x:hidden; }
  body { margin:0; font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:16px 20px 0; display:flex; align-items:baseline; gap:12px; }
  header h1 { font-size:20px; margin:0; }
  header span { color:var(--muted); font-size:13px; }
  main { max-width:900px; margin:0 auto; padding:16px 16px 48px; width:100%; }
  .capture { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; }
  @media (max-width:640px) { .capture { grid-template-columns:minmax(0,1fr); } }
  .btn { display:flex; flex-wrap:wrap; min-width:0; text-align:center; align-items:center; justify-content:center; gap:10px; padding:22px 16px; border-radius:14px; font-weight:700; font-size:18px; cursor:pointer; border:2px solid transparent; user-select:none; }
  .btn.primary { background:var(--accent); color:#fff; }
  .btn.secondary { background:var(--card); color:var(--ink); border-color:var(--line); }
  .btn input { display:none; }
  .hint { color:var(--muted); font-size:13px; margin:10px 8px 0; text-align:center; overflow-wrap:anywhere; }
  .drop.over { outline:3px dashed var(--accent); outline-offset:-6px; border-radius:14px; }
  .opts { display:flex; gap:16px; justify-content:center; margin-top:10px; font-size:14px; color:var(--muted); flex-wrap:wrap; }
  .row { display:flex; gap:16px; margin-top:20px; flex-wrap:wrap; }
  .preview { flex:0 0 240px; }
  .preview img { width:100%; border-radius:12px; background:#fff; border:1px solid var(--line); }
  .results { flex:1; min-width:280px; }
  .verdict { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .tier { display:inline-block; padding:4px 12px; border-radius:999px; font-weight:700; font-size:13px; color:#fff; letter-spacing:.02em; }
  .tier.exact { background:var(--ok);} .tier.likely{ background:var(--accent);} .tier.candidate{ background:var(--warn);} .tier.unknown{ background:var(--bad);}
  .verdict .pn { font-size:26px; font-weight:800; margin-top:6px; }
  .verdict .name { color:var(--muted); }
  .cand { display:flex; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  .cand img { width:84px; height:84px; object-fit:contain; border-radius:8px; background:#fff; border:1px solid var(--line); flex:0 0 84px; }
  .cand .pn { font-weight:700; font-size:16px; }
  .cand .meta { color:var(--muted); font-size:13px; }
  .bar { height:6px; background:var(--line); border-radius:3px; margin-top:6px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); }
  ul.reasons { margin:6px 0 0; padding-left:18px; font-size:12px; color:var(--muted); }
  .timings { font-size:12px; color:var(--muted); margin-top:8px; }
  .spinner { display:inline-block; width:18px; height:18px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; vertical-align:middle; margin-right:8px; }
  @keyframes spin { to { transform:rotate(360deg);} }
  .actions { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
  .actions button { padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  a.link { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<header><h1>McMaster-Vision</h1><span>one photo &rarr; part number</span></header>
<main>
  <div class="drop" id="drop">
    <div class="capture">
      <label class="btn primary">
        &#128247; Take a photo
        <input type="file" id="camera" accept="image/*" capture="environment">
      </label>
      <label class="btn secondary">
        &#128193; Choose an image or screenshot
        <input type="file" id="file" accept="image/*">
      </label>
    </div>
    <p class="hint">On a phone, "Take a photo" opens the camera. On a desktop you can also drag an image here or paste a screenshot (Ctrl/Cmd+V).</p>
    <div class="opts">
      <label><input type="checkbox" id="llm"> use vision-LLM reranker</label>
      <label>show top <select id="topn"><option>3</option><option selected>5</option><option>10</option></select></label>
    </div>
  </div>

  <div class="row">
    <div class="preview" id="preview" hidden>
      <img id="img" alt="query">
      <div class="actions"><button id="again">Another photo</button></div>
    </div>
    <div class="results" id="results"></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const drop = $('drop'), results = $('results'), preview = $('preview'), img = $('img');
for (const id of ['camera', 'file']) $(id).addEventListener('change', e => { if (e.target.files[0]) send(e.target.files[0]); e.target.value = ''; });
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) send(e.dataTransfer.files[0]); });
window.addEventListener('paste', e => { for (const it of e.clipboardData.items) if (it.type.startsWith('image/')) { send(it.getAsFile()); break; } });
$('again').addEventListener('click', () => { preview.hidden = true; results.innerHTML = ''; window.scrollTo({top: 0, behavior: 'smooth'}); });

async function downscale(file, max = 1280) {
  // Phones produce 12 MP JPEGs; the model only needs a few hundred px. Resize client-side to keep uploads fast.
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (s === 1) return file;
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
    return new File([blob], 'query.jpg', { type: 'image/jpeg' });
  } catch (_) { return file; }
}

async function send(file) {
  preview.hidden = false; img.src = URL.createObjectURL(file);
  results.innerHTML = '<p><span class="spinner"></span>Identifying&hellip;</p>';
  const small = await downscale(file);
  const fd = new FormData(); fd.append('file', small);
  const q = new URLSearchParams({ top_n: $('topn').value }); if ($('llm').checked) q.set('use_llm', 'true');
  let r;
  try { r = await fetch(`/identify?${q}`, { method: 'POST', body: fd }); }
  catch (e) { results.innerHTML = `<p style="color:var(--bad)">Network error: ${e}</p>`; return; }
  if (!r.ok) { let d = ''; try { d = (await r.json()).detail; } catch (_) {} results.innerHTML = `<p style="color:var(--bad)">Error ${r.status}: ${esc(d)}</p>`; return; }
  render(await r.json());
  results.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = x => (x * 100).toFixed(0) + '%';
function render(res) {
  const tierText = { exact: 'Exact match', likely: 'Likely match', candidate: 'Possible matches', unknown: 'No confident match' }[res.tier] || res.tier;
  let html = `<div class="verdict"><span class="tier ${res.tier}">${esc(tierText)}</span>`;
  if (res.best) html += `<div class="pn">${esc(res.best.part_number)}</div><div class="name">${esc(res.best.name)} &middot; ${pct(res.best.confidence)} confidence</div>`;
  else html += `<div class="name">Try another angle, closer, on a plain background &mdash; or search by text below.</div>`;
  if (res.ocr_part_numbers.length) html += `<div class="name">Part number read from the photo: ${res.ocr_part_numbers.map(esc).join(', ')}</div>`;
  if (res.extracted) { const ex = res.extracted; const bits = [ex.part_type, ex.material_guess, ex.head_type, ex.drive_style].filter(Boolean).map(esc); if (bits.length) html += `<div class="name">Seen in photo: ${bits.join(' &middot; ')}</div>`; }
  html += '</div>';
  for (const c of res.candidates) {
    html += `<div class="cand">
      <img src="/parts/${encodeURIComponent(c.part_number)}/image" loading="lazy" onerror="this.style.visibility='hidden'">
      <div style="flex:1;min-width:0">
        <div class="pn">${esc(c.part_number)} <span style="font-weight:400">&mdash; ${esc(c.name)}</span></div>
        <div class="meta">${esc(c.category_path.join(' › '))}</div>
        <div class="meta">${Object.entries(c.attributes).map(([k,v]) => `${esc(k)}: ${esc(v)}`).join(' · ')}</div>
        <div class="bar"><i style="width:${Math.round(c.confidence*100)}%"></i></div>
        <div class="meta">confidence ${(c.confidence*100).toFixed(1)}% · similarity ${c.similarity.toFixed(3)} · <a class="link" href="https://www.mcmaster.com/${encodeURIComponent(c.part_number)}/" target="_blank" rel="noopener">open on mcmaster.com</a></div>
        <ul class="reasons">${c.reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
      </div></div>`;
  }
  html += `<div class="timings">model ${esc(res.model_version)} · ${Object.entries(res.timings_ms).map(([k,v]) => `${k} ${v}ms`).join(' · ')}</div>`;
  results.innerHTML = html;
}
</script>
</body>
</html>
