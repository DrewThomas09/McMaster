[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcmaster-vision"
version = "0.1.0"
description = "Photo-to-part-number identification for the McMaster-Carr catalog (~700k SKUs) using visual embeddings, vector search, and multimodal reranking."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Real neural backbones (CLIP / SigLIP / DINOv2) and the training loop.
ml = [
    "torch>=2.2",
    "torchvision>=0.17",
    "open_clip_torch>=2.24",
    "timm>=0.9",
]
# Approximate nearest-neighbour index that scales to 700k+ vectors.
faiss = ["faiss-cpu>=1.8"]
# Optical character recognition for part numbers stamped / printed on parts or packaging.
ocr = ["easyocr>=1.7"]
# Multimodal LLM reranker (Claude vision) for the final top-K decision.
llm = ["anthropic>=0.40"]
# Background removal for cleaner query photos.
segment = ["rembg>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]
all = ["mcmaster-vision[ml,faiss,ocr,llm,segment,dev]"]

[project.scripts]
mcv = "mcmaster_vision.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mcmaster_vision.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Depends()/File()/typer.Option() in defaults is the idiomatic FastAPI / typer style.
"src/mcmaster_vision/api/app.py" = ["B008"]
"src/mcmaster_vision/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
