services:
  api:
    build:
      context: .
      args:
        EXTRAS: faiss,llm
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      MCV_DATA_DIR: /data
      MCV_CATALOG_DB: /data/catalog/catalog.sqlite
      MCV_INDEX_DIR: /data/index
      MCV_MODEL_DIR: /data/models
      MCV_QUERIES_DIR: /data/queries
    volumes:
      - ./data:/data
    command: ["mcv", "serve", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:  # /health is cheap and reports ready: true once the index is loaded
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Closes the loop on a schedule: confirmed and bought photos into the index every hour,
  # a purchase-weighted retrain once MCV_LEARN_RETRAIN_AFTER new ones arrived. The API
  # picks a rebuilt index up by itself; a retrain that switches model version goes to
  # sibling directories and is switched on by an explicit env change (see RUNBOOK 3).
  learner:
    build:
      context: .
      args:
        EXTRAS: ml,faiss
    env_file: .env
    environment:
      MCV_DATA_DIR: /data
      MCV_CATALOG_DB: /data/catalog/catalog.sqlite
      MCV_INDEX_DIR: /data/index
      MCV_MODEL_DIR: /data/models
      MCV_QUERIES_DIR: /data/queries
      MCV_LEARN_EVERY_S: "3600"
    volumes:
      - ./data:/data
    restart: unless-stopped
    command: ["sh", "-c", "while true; do mcv learn >> /data/logs/learn.log 2>&1; sleep ${MCV_LEARN_EVERY_S:-3600}; done"]

  # One-shot job: ingest a catalog export, embed every image, build the index.
  indexer:
    build:
      context: .
      args:
        EXTRAS: ml,faiss
    env_file: .env
    environment:
      MCV_DATA_DIR: /data
      MCV_CATALOG_DB: /data/catalog/catalog.sqlite
      MCV_INDEX_DIR: /data/index
      MCV_MODEL_DIR: /data/models
    volumes:
      - ./data:/data
    profiles: ["jobs"]
    command: ["sh", "-c", "mcv ingest /data/catalog/parts.jsonl && mcv build-index"]

  # One-shot job: archive everything learned at run time to /data/backups.
  backup:
    build:
      context: .
    environment:
      MCV_DATA_DIR: /data
      MCV_CATALOG_DB: /data/catalog/catalog.sqlite
      MCV_INDEX_DIR: /data/index
      MCV_MODEL_DIR: /data/models
      MCV_QUERIES_DIR: /data/queries
    volumes:
      - ./data:/data
    profiles: ["jobs"]
    command: ["mcv", "backup"]
